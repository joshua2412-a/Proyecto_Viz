<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img"
     aria-labelledby="portada-titulo portada-desc" preserveAspectRatio="xMidYMid meet">
  <title id="portada-titulo">De la imagen al panel molecular</title>
  <desc id="portada-desc">Corte axial esquematico de un cerebro con una lesion en un
  hemisferio, enlazado por una linea de puntos a una cuadricula de veinte casillas que
  representa el panel de genes del estudio; la primera casilla, IDH1, aparece resaltada.</desc>

  <!--
    Portada de la pestana de introduccion.

    Dibujada a mano con la paleta de utils/theme.py para que la portada y los
    graficos se lean como una sola pieza. Un SVG no puede importar las constantes
    de Python, asi que si algun dia cambias los tokens del tema, estos valores
    hay que cambiarlos aqui tambien:

        #1E4E86  acento de interfaz (COLOR_MARK / ACCENT_NEUTRAL)
        #4E8CD9  azul de LGG
        #E0785A  coral de GBM, reservado aqui a la lesion, que es el tumor
        #647285  tinta apagada de los pies
        #C3CEDC  filete fuerte
        #DFE6EF  filete

    Que cuenta: a la izquierda, como se caracteriza hoy el tumor (imagen e
    histologia); a la derecha, la alternativa molecular. La linea de puntos es el
    salto que estudia el proyecto, y la casilla resaltada es IDH1, el gen que
    carga con casi toda la separacion entre LGG y GBM.

    Geometria: la silueta cortical es una superelipse en coordenadas polares con
    un rizo sinusoidal que dibuja las circunvoluciones, y los surcos son normales
    al borde con longitud y angulo irregulares. Solo esta descrito el hemisferio
    derecho: el izquierdo es su reflejo, de modo que la simetria es exacta. La
    cisura interhemisferica se abre en el centro y se cierra en los polos, como
    en un corte real.
  -->

